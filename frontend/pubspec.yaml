name: ai_companion
description: AI girlfriend companion app with calling interface

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.7
  flutter_riverpod: ^2.4.7
  
  # Audio
  audio_session: ^0.1.16
  just_audio: ^0.9.35
  record: ^5.0.4
  permission_handler: ^11.0.1
  
  # UI
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  lottie: ^2.7.0
  animations: ^2.0.8
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.1.0
  path_provider: ^2.1.1
  device_info_plus: ^9.1.0
  
  # Networking
  connectivity_plus: ^5.0.1
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
