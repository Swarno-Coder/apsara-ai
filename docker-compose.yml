version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///app/data/companion.db
      - WHISPER_MODEL_PATH=/app/models/whisper/ggml-base.bin
      - PIPER_MODELS_DIR=/app/models/piper
      - TTS_OUTPUT_DIR=/app/audio_cache
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./audio_cache:/app/audio_cache
    depends_on:
      - model-downloader
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model downloader (runs once to download models)
  model-downloader:
    build:
      context: ./backend
      dockerfile: Dockerfile.models
    volumes:
      - ./models:/app/models
    command: python download_models.py
    restart: "no"

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: ai-companion-network
